# Performance measurement run with playwright-performance-regression (pw-perf).
# Include this file from .gitlab-ci.yml. Runs in merge request pipelines and scheduled
# pipelines; exit code 2 (performance regression) is a soft failure, 3 (tool or config error)
# fails the job. The report in pw-perf-results/ is kept also when the job fails.
perf:
  image: node:22
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npx pw-perf test
  allow_failure:
    exit_codes: 2
  artifacts:
    when: always
    paths:
      - pw-perf-results/
    expire_in: 30 days
