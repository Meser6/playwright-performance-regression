name: CI

# Every pull request and push to main, and the release workflow (13-REQ-09, 13-REQ-11, 13-D-20):
# - checks: lint, format, types, generated files, package checks, AC coverage (once);
# - test: unit, contract, integration and e2e tests with Chromium. Pull requests and pushes run
#   three cells; the release workflow (input full) and a manual run with "full" run the whole
#   OS x Node x Playwright matrix;
# - browsers: Firefox and WebKit, informational (best effort, D-13), full matrix only.
# Performance tests run before every release (perf.yml, called by the release workflow, or by
# hand; never on a schedule, 12-D-05, 13-D-20); statistical tests run in weekly.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Run the full OS x Node x Playwright matrix
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Run the full OS x Node x Playwright matrix
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    # Pinned: Chromium of the lowest supported Playwright (the dev dependency, 1.57) does not
    # install on newer Ubuntu releases that ubuntu-latest may point to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:types-generated
      - run: pnpm check:html-generated
      - run: pnpm check:ci-generated
      - run: pnpm check:docs-generated
      - run: pnpm check:config-template-generated
      # 13-AC-07: actionlint (workflow linter) on the GitHub Actions recipe and on the workflows
      # of this repository (the other recipes are checked by test/contract/ci-recipes.test.ts).
      - name: Lint the GitHub Actions recipe and workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color examples/ci/github-actions.yml .github/workflows/*.yml
      - run: pnpm check:ac
      - run: pnpm build
      # 13-REQ-11: package.json rules, packed contents and unpacked size of both packages.
      - run: pnpm check:packages
      - run: pnpm publint
      - run: pnpm attw

  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
      full: ${{ steps.cells.outputs.full }}
    steps:
      # 13-REQ-09: three cells on pull requests and pushes, the full matrix before a release.
      # ubuntu-24.04: see the checks job.
      - id: cells
        env:
          FULL: ${{ inputs.full == true }}
        run: |
          if [ "$FULL" = "true" ]; then
            cells='[
              {"os":"ubuntu-24.04","node":22,"playwright":"minimum"},
              {"os":"ubuntu-24.04","node":22,"playwright":"latest"},
              {"os":"ubuntu-24.04","node":24,"playwright":"minimum"},
              {"os":"ubuntu-24.04","node":24,"playwright":"latest"},
              {"os":"ubuntu-24.04","node":26,"playwright":"minimum"},
              {"os":"ubuntu-24.04","node":26,"playwright":"latest"},
              {"os":"macos-latest","node":22,"playwright":"latest"},
              {"os":"macos-latest","node":26,"playwright":"latest"},
              {"os":"windows-latest","node":22,"playwright":"latest"},
              {"os":"windows-latest","node":26,"playwright":"latest"}
            ]'
          else
            cells='[
              {"os":"ubuntu-24.04","node":24,"playwright":"latest"},
              {"os":"ubuntu-24.04","node":22,"playwright":"minimum"},
              {"os":"windows-latest","node":24,"playwright":"latest"}
            ]'
          fi
          echo "cells=$(echo "$cells" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }}, Playwright ${{ matrix.playwright }})
    runs-on: ${{ matrix.os }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.cells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # "minimum" is the pinned dev dependency (the lowest supported version, 01, chapter 12.2).
      - name: Install the latest Playwright
        if: matrix.playwright == 'latest'
        shell: bash
        run: pnpm add --save-dev --save-exact @playwright/test@latest
      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # The integration and e2e tests run real Chromium (12, chapter 6). Browsers are cached
      # per OS and Playwright version; the Linux system libraries are installed on every run.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm build
      - run: pnpm test

  browsers:
    name: Browsers (Firefox, WebKit; informational)
    # Best effort (D-13): a failure is reported but never blocks a merge. Full matrix only.
    needs: matrix
    if: needs.matrix.outputs.full == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev --save-exact @playwright/test@latest
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - name: Measure Firefox and WebKit projects
        run: pnpm vitest run test/integration/projects.test.ts -t multi-browser
        env:
          INTEGRATION_BROWSERS: firefox,webkit
