name: Weekly

# - Playwright pre-release (13-REQ-10, R-04): the full test suite on Linux, Node 24, Chromium with
#   @playwright/test@next;
# - statistical tests (12-STAT-01 – 12-STAT-03), results as an artifact (12-REQ-12, 12-AC-04).
# A failed scheduled run opens an issue; it never blocks a pull request.

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright-next:
    name: Playwright next (Linux, Node 24, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev --save-exact @playwright/test@next
      - run: pnpm exec playwright --version
      - run: pnpm exec playwright install --with-deps chromium
      # xmllint validates the golden junit.xml files against junit-10.xsd (16-AC-01).
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: pnpm build
      - run: pnpm test

  stats:
    name: Statistical tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:stats
        env:
          PERF_RESULTS_DIR: ${{ runner.temp }}/stat-test-results
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stat-test-results
          path: ${{ runner.temp }}/stat-test-results
          retention-days: 90
          if-no-files-found: warn

  report-failure:
    name: Open an issue on failure
    needs: [playwright-next, stats]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly CI run failed"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          body="The weekly run (Playwright next, statistical tests) failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
