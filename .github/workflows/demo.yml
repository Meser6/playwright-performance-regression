name: Demo report

# The demo HTML reports on GitHub Pages (13-REQ-17, 13-REQ-29): examples/with-setup measured
# against the demo server of this repository, one thresholds run and two test runs in one job
# (scripts/build-demo-report.mjs): slow-endpoint.html (a blocking time violation) and
# fast-failure.html (fast 401s fail the nonSuccess rule), linked from index.html. Runs after a
# stable release (release.yml) or by hand.
# GitHub Pages needs a public repository (or a paid plan): while the repository is private the
# report is built and kept as a workflow artifact, and the deployment is skipped.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: node scripts/build-demo-report.mjs --out "$RUNNER_TEMP/demo"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/demo

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
